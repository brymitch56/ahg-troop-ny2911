name: Sync troop calendar

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and scrub iCal feed
        env:
          # Set in repo Settings -> Secrets and variables -> Actions.
          # Falls back to the public feed if the secret isn't set.
          ICAL_URL: ${{ secrets.PRIVATE_ICAL_URL }}
        run: |
          mkdir -p data
          URL="${ICAL_URL:-https://www.ahgfamily.org/icalendar/tkf9ba220a56/na/public}"
          curl -fsSL --max-time 30 "$URL" -o /tmp/raw.ics
          if ! grep -q "BEGIN:VCALENDAR" /tmp/raw.ics; then
            echo "Feed response invalid; keeping previous calendar." >&2
            exit 0
          fi
          python3 scripts/scrub_calendar.py /tmp/raw.ics data/calendar.ics

      - name: Commit if changed
        run: |
          git config user.name "calendar-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calendar.ics
          git diff --cached --quiet || git commit -m "Update troop calendar feed"
          git push
